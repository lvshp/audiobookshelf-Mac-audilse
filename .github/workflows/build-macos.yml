name: Build Audilse for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VLC_BUNDLE_URL: ${{ secrets.VLC_BUNDLE_URL }}
      VLC_BUNDLE_SHA256: ${{ vars.VLC_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check runner and dependency configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -n "$VLC_BUNDLE_URL" || { echo 'Set the VLC_BUNDLE_URL repository secret. See BUILDING.md.' >&2; exit 1; }
          [[ "$VLC_BUNDLE_URL" == https://* ]] || { echo 'VLC_BUNDLE_URL must use HTTPS.' >&2; exit 1; }
          [[ "$VLC_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Set VLC_BUNDLE_SHA256 to the dependency archive SHA-256.' >&2; exit 1; }
          xcodebuild -version
          swift --version
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
            test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Tag must match the app version.' >&2; exit 1; }
          fi
      - name: Download and verify patched VLC and source materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-inputs build/ci-dependencies
          curl --fail --location --silent --show-error --retry 3 --max-time 900 \
            --proto '=https' --proto-redir '=https' \
            "$VLC_BUNDLE_URL" -o build/ci-inputs/Audilse-vlc-dependencies.tar.gz
          printf '%s  %s\n' "$VLC_BUNDLE_SHA256" build/ci-inputs/Audilse-vlc-dependencies.tar.gz | shasum -a 256 -c -
          tar -xzf build/ci-inputs/Audilse-vlc-dependencies.tar.gz -C build/ci-dependencies
          /usr/bin/python3 -I scripts/import-patched-vlc.py \
            --source build/ci-dependencies/VLCKit.xcframework --apply
          /usr/bin/python3 -I scripts/ci-vlc-bundle.py verify build/ci-dependencies/vlc-source-delivery
      - name: Run playback and core tests
        run: |
          set -o pipefail
          mkdir -p build/test-diagnostics
          bash scripts/test.sh 2>&1 | tee build/test-diagnostics/tests.log
      - name: Verify asynchronous application termination
        run: python3 scripts/test-app-termination.py
      - name: Collect test crash reports
        if: failure()
        shell: bash
        run: |
          mkdir -p build/test-diagnostics
          # ReportCrash writes asynchronously after the test helper exits.
          sleep 5
          find "$HOME/Library/Logs/DiagnosticReports" -type f \( -name '*swiftpm*' -o -name '*Audilse*' \) -exec cp {} build/test-diagnostics/ \; 2>/dev/null || true
      - name: Capture test crash backtrace
        if: failure()
        timeout-minutes: 3
        shell: bash
        run: |
          BIN_DIR="$(swift build --disable-sandbox --show-bin-path --cache-path .build/package-cache)"
          TEST_BINARY="$BIN_DIR/AudilsePackageTests.xctest/Contents/MacOS/AudilsePackageTests"
          HELPER="$(dirname "$(xcrun --find swift)")/../libexec/swift/pm/swiftpm-testing-helper"
          if [[ -f "$TEST_BINARY" && -x "$HELPER" ]]; then
            xcrun lldb --batch \
              -o "settings set target.env-vars DYLD_FRAMEWORK_PATH=$(xcode-select -p)/Platforms/MacOSX.platform/Developer/Library/Frameworks" \
              -o run -k 'thread backtrace all' \
              -- "$HELPER" --test-bundle-path "$TEST_BINARY" --testing-library swift-testing \
              > build/test-diagnostics/backtrace.log 2>&1
          fi
      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Audilse-test-diagnostics-${{ github.run_number }}
          path: build/test-diagnostics/
          retention-days: 7
      - name: Build Release app
        run: bash scripts/build-app.sh
      - name: Verify app resources outside the checkout
        run: bash scripts/verify-app-resources.sh build/Audilse.app
      - name: Package and verify DMG
        run: bash scripts/package-dmg.sh build/Audilse.app build/ci-output
      - name: Include project source and dependency materials
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=build/ci-output/Audilse-source.tar.gz HEAD
          cp build/ci-inputs/Audilse-vlc-dependencies.tar.gz build/ci-output/
          (cd build/ci-output && shasum -a 256 Audilse-source.tar.gz Audilse-vlc-dependencies.tar.gz > SOURCE-SHA256SUMS.txt)
      - name: Upload build and corresponding VLC materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Audilse-arm64-${{ github.run_number }}
          path: build/ci-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Audilse-arm64-${{ github.run_number }}
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/Audilse-${RELEASE_TAG#v}-arm64.dmg"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Audilse 的 macOS 安装包，适用于 Apple Silicon（M 系列），需要 macOS 14 或更新版本。

          下载 DMG 后将 Audilse 拖入 Applications。支持在线与离线收听、章节跳转、播客订阅、电子书阅读和服务器管理。

          本次更新：

          - 点击底部封面或标题，展开右侧播放页；折叠侧边栏后铺满内容窗口。
          - 播放页支持进度、倍速、定时、章节和队列控制，可通过收起按钮或 Esc 返回。
          - 修复搜索框焦点无法退出的问题，点击框外或按 Esc 可结束输入并保留搜索文字。
          - 更新过程显示下载进度、文件大小、安装阶段和耗时。
          - 修复在线更新在退出并重启阶段长时间等待的问题。
          - 修复“管理内容”弹窗顶部导航异常，并改善标签页与正文间距及切页焦点。

          安装包采用 ad-hoc 签名，未经过 Apple 公证。

          首次打开：

          1. 打开 DMG，将 Audilse 拖入「应用程序」。
          2. 在「应用程序」中双击 Audilse。如果 macOS 提示无法验证开发者或无法检查恶意软件，先关闭提示。
          3. 打开「系统设置 → 隐私与安全性」，向下找到 Audilse 的拦截提示，点击「仍要打开」。
          4. 按系统提示完成验证，再点击「打开」。之后即可正常双击启动。

          操作说明：[Apple 官方帮助](https://support.apple.com/zh-cn/102445)。
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Audilse $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest

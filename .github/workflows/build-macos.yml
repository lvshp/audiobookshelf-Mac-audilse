name: Build Audilse for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VLC_BUNDLE_URL: ${{ secrets.VLC_BUNDLE_URL }}
      VLC_BUNDLE_SHA256: ${{ vars.VLC_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check runner and dependency configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -n "$VLC_BUNDLE_URL" || { echo 'Set the VLC_BUNDLE_URL repository secret. See BUILDING.md.' >&2; exit 1; }
          [[ "$VLC_BUNDLE_URL" == https://* ]] || { echo 'VLC_BUNDLE_URL must use HTTPS.' >&2; exit 1; }
          [[ "$VLC_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Set VLC_BUNDLE_SHA256 to the dependency archive SHA-256.' >&2; exit 1; }
          xcodebuild -version
          swift --version
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)
            test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Tag must match the app version.' >&2; exit 1; }
          fi
      - name: Download and verify patched VLC and source materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-inputs build/ci-dependencies
          curl --fail --location --silent --show-error --retry 3 --max-time 900 \
            --proto '=https' --proto-redir '=https' \
            "$VLC_BUNDLE_URL" -o build/ci-inputs/Audilse-vlc-dependencies.tar.gz
          printf '%s  %s\n' "$VLC_BUNDLE_SHA256" build/ci-inputs/Audilse-vlc-dependencies.tar.gz | shasum -a 256 -c -
          tar -xzf build/ci-inputs/Audilse-vlc-dependencies.tar.gz -C build/ci-dependencies
          /usr/bin/python3 -I scripts/import-patched-vlc.py \
            --source build/ci-dependencies/VLCKit.xcframework --apply
          /usr/bin/python3 -I scripts/ci-vlc-bundle.py verify build/ci-dependencies/vlc-source-delivery
      - name: Run playback and core tests
        run: bash scripts/test.sh
      - name: Build Release app
        run: bash scripts/build-app.sh
      - name: Package and verify DMG
        run: bash scripts/package-dmg.sh build/Audilse.app build/ci-output
      - name: Include project source and dependency materials
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=build/ci-output/Audilse-source.tar.gz HEAD
          cp build/ci-inputs/Audilse-vlc-dependencies.tar.gz build/ci-output/
          (cd build/ci-output && shasum -a 256 Audilse-source.tar.gz Audilse-vlc-dependencies.tar.gz > SOURCE-SHA256SUMS.txt)
      - name: Upload build and corresponding VLC materials
        uses: actions/upload-artifact@v4
        with:
          name: Audilse-arm64-${{ github.run_number }}
          path: build/ci-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Audilse-arm64-${{ github.run_number }}
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Audilse 的 macOS 安装包，适用于 Apple Silicon（M 系列），需要 macOS 14 或更新版本。

          下载 DMG 后将 Audilse 拖入 Applications。支持在线与离线收听、章节跳转、播客订阅、电子书阅读和服务器管理。

          本版本包含 HLS 播放缓冲与章节跳转修复。安装包采用 ad-hoc 签名，未经过 Apple 公证。

          原创代码仅限非商业使用。附件同时提供项目源码、VLC 对应源码材料、第三方声明及校验值。
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Audilse $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest

name: Publish a verified build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Audilse run ID
        required: true
        type: string
      tag:
        description: Existing version tag pointing to the tested commit
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify successful build and version tag
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e '.conclusion == "success" and .path == ".github/workflows/build-macos.yml" and (.event == "workflow_dispatch" or .event == "push")' "$RUNNER_TEMP/run.json"
          BUILD_SHA=$(jq -r .head_sha "$RUNNER_TEMP/run.json")
          TAG_SHA=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$BUILD_SHA" = "$TAG_SHA"
          RUN_NUMBER=$(jq -r .run_number "$RUNNER_TEMP/run.json")
          echo "artifact=Audilse-arm64-$RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SOURCE-SHA256SUMS.txt
          shopt -s nullglob
          DMGS=(Audilse-*-arm64.dmg)
          test "${#DMGS[@]}" = 1
          DMG="${DMGS[0]}"
          [[ "$DMG" == "Audilse-${RELEASE_TAG#v}-arm64.dmg" ]]
          EXPECTED=$(awk '{print $1}' "$DMG.sha256")
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED" "$DMG" | sha256sum -c -
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Audiobookshelf 的原生 macOS 客户端，适用于 Apple Silicon（M 系列），需要 macOS 14 或更新版本。

          下载 DMG，将 Audilse 拖入 Applications。支持有声书在线与离线收听、章节跳转、进度同步、播客订阅、电子书阅读和服务器管理，提供简体中文与 English。

          本次更新：

          - 点击底部封面或标题，展开右侧播放页；折叠侧边栏后铺满内容窗口。
          - 播放页支持进度、倍速、定时、章节和队列控制，可通过收起按钮或 Esc 返回。
          - 修复搜索框焦点无法退出的问题，点击框外或按 Esc 可结束输入并保留搜索文字。
          - 更新过程显示下载进度、文件大小、安装阶段和耗时。
          - 修复在线更新在退出并重启阶段长时间等待的问题。
          - 修复“管理内容”弹窗顶部导航异常，并改善标签页与正文间距及切页焦点。

          安装包采用 ad-hoc 签名，未经过 Apple 公证。

          首次打开：

          1. 打开 DMG，将 Audilse 拖入「应用程序」。
          2. 在「应用程序」中双击 Audilse。如果 macOS 提示无法验证开发者或无法检查恶意软件，先关闭提示。
          3. 打开「系统设置 → 隐私与安全性」，向下找到 Audilse 的拦截提示，点击「仍要打开」。
          4. 按系统提示完成验证，再点击「打开」。之后即可正常双击启动。

          操作说明：[Apple 官方帮助](https://support.apple.com/zh-cn/102445)。
          NOTES
          RELEASE_ENDPOINT="repos/$GH_REPO/releases/tags/$RELEASE_TAG"
          if gh api --include "$RELEASE_ENDPOINT" > "$RUNNER_TEMP/release-response.txt"; then
            # Upload everything first. A failed upload must retain the old DMG.
            # Updating assets does not edit the existing release title or body.
            gh release upload "$RELEASE_TAG" ./* --clobber
            RELEASE_ID=$(gh api "$RELEASE_ENDPOINT" --jq .id)
            [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
            gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets" \
              --jq '.[].name' > "$RUNNER_TEMP/release-asset-names.txt"
            PREFIX="Audilse-${RELEASE_TAG#v}-build"
            while IFS= read -r ASSET; do
              [[ "$ASSET" == "$PREFIX"* ]] || continue
              SUFFIX="${ASSET#"$PREFIX"}"
              [[ "$SUFFIX" =~ ^[0-9]+-arm64\.dmg(\.sha256)?$ ]] || continue
              [[ "$ASSET" != "$DMG" && "$ASSET" != "$DMG.sha256" ]] || continue
              gh release delete-asset "$RELEASE_TAG" "$ASSET" --yes
            done < "$RUNNER_TEMP/release-asset-names.txt"
          else
            STATUS=$(awk 'NR == 1 {print $2}' "$RUNNER_TEMP/release-response.txt")
            if [[ "$STATUS" != 404 ]]; then
              echo "Release lookup failed (HTTP ${STATUS:-unavailable}); refusing to create or replace it." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" ./* --verify-tag \
              --title "Audilse ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
